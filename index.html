<style>
:root{color-scheme:dark;--bg:#080808;--text:#eee8e2;--soft:#d8d0c8;--muted:#a9937d;--accent:#b49a7b;--glass:rgba(23,21,19,.78);--button:rgba(28,26,24,.9);--line:rgba(255,255,255,.24);--safe:max(14px,env(safe-area-inset-bottom))}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#080808!important;color:var(--text)}body{overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.screen{position:relative;width:100%;height:100svh;overflow:hidden;background:#080808!important}.background{position:absolute;inset:0;background:#080808!important}.background:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(185,145,103,.14),transparent 34%),linear-gradient(180deg,#18110d 0%,#0a0908 55%,#080808 100%)}.scene-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.52;filter:brightness(.47) saturate(.62) contrast(1.06);mix-blend-mode:screen;transition:opacity .9s ease,filter .9s ease,transform .9s ease}.scene-background.is-changing{opacity:.03;filter:brightness(.25) blur(4px) saturate(.2);transform:scale(1.035)}.screen:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.58) 48%,rgba(0,0,0,.92))}.topbar{position:absolute;top:16px;left:50%;z-index:8;width:calc(100% - 28px);display:flex;justify-content:space-between;transform:translateX(-50%);text-shadow:0 2px 13px #000}.top-group{display:flex;flex-direction:column;gap:4px;max-width:70%}.top-group.right{align-items:flex-end}.label{color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.value{color:var(--soft);font-size:13px;white-space:nowrap}.chapter-mark{position:absolute;top:22%;left:14px;z-index:4;color:rgba(255,255,255,.1);font:italic 74px/1 Georgia,serif}.ui{position:absolute;inset:0;z-index:5}.character-image{position:absolute;left:50%;bottom:calc(var(--safe) + 143px);z-index:3;width:min(46vw,260px);height:min(46vw,260px);object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:drop-shadow(0 18px 28px rgba(0,0,0,.65));pointer-events:none;transition:opacity .72s ease,transform .72s cubic-bezier(.22,.61,.36,1),filter .72s ease}.character-image.is-changing{opacity:0;transform:translateX(-50%) translateY(12px) scale(.97);filter:blur(3px) drop-shadow(0 18px 28px rgba(0,0,0,.65))}.dialogue-area{position:absolute;left:50%;bottom:calc(var(--safe) + 160px);z-index:6;width:calc(100% - 28px);max-width:620px;padding-top:17px;transform:translateX(-50%);pointer-events:none}.dialogue-card{position:relative;width:100%;min-height:108px;max-height:22svh;padding:28px 18px 16px;overflow:visible;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.012)),var(--glass)!important;box-shadow:0 20px 52px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(25px) saturate(120%);-webkit-backdrop-filter:blur(25px) saturate(120%);pointer-events:auto;transition:opacity .43s ease,transform .43s ease}.dialogue-card.is-changing{opacity:0;transform:translateY(10px) scale(.987)}.name{position:absolute;top:-15px;left:17px;z-index:20;padding:6px 13px;color:#f0e7de;background:rgba(37,31,27,.97)!important;border:1px solid rgba(255,255,255,.28);border-radius:999px;box-shadow:0 7px 18px #000b;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:opacity .3s ease}.name.is-changing{opacity:0}.kind{position:absolute;top:12px;right:17px;color:var(--muted);font-size:7px;letter-spacing:.14em;text-transform:uppercase}.text{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;max-height:12svh;margin:0;overflow:hidden;color:var(--text)!important;font:500 clamp(14px,1.9vw,19px)/1.3 Georgia,serif;text-align:center;white-space:pre-line;overflow-wrap:anywhere;transition:opacity .27s ease,transform .27s ease}.text.is-changing{opacity:0;transform:translateY(7px)}.text.is-line-changing{opacity:0;transform:translateY(4px)}.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted);font-size:7px;letter-spacing:.13em;text-transform:uppercase}.hint i{width:22px;height:1px;background:var(--accent)}.choices{position:absolute;left:50%;bottom:calc(var(--safe) + 40px);z-index:10;width:calc(100% - 28px);max-width:620px;transform:translateX(-50%);pointer-events:auto}.choices[hidden]{display:none}.choice-title{display:flex;justify-content:center;gap:8px;margin-bottom:7px;color:var(--muted);font-size:7px;letter-spacing:.16em;text-transform:uppercase}.choice-title:before,.choice-title:after{content:"•";color:var(--accent)}.choice-list{display:grid;gap:6px}.choice{display:block;width:100%;min-height:36px;padding:8px 11px;color:var(--soft)!important;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.015)),var(--button)!important;border:1px solid rgba(255,255,255,.15);border-radius:14px;box-shadow:0 8px 20px #000a;cursor:pointer;font-size:11px;line-height:1.2;text-align:center;opacity:0;transform:translateY(8px);animation:choice-in .43s ease forwards;transition:transform .18s ease,opacity .18s ease}.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}.choice:active{transform:scale(.985)}.choice:disabled{cursor:wait;opacity:.45}.choice.selected{color:#fff!important;background:rgba(145,119,91,.82)!important;border-color:rgba(255,255,255,.4)}.footer{position:absolute;left:50%;bottom:6px;z-index:9;width:calc(100% - 28px);display:flex;justify-content:space-between;transform:translateX(-50%);color:var(--muted);font-size:7px;letter-spacing:.07em;text-transform:uppercase}.restart{padding:5px 8px;color:var(--soft)!important;background:rgba(20,20,20,.88)!important;border:1px solid rgba(255,255,255,.16);border-radius:999px;cursor:pointer;font-size:7px;text-transform:uppercase}@keyframes choice-in{to{opacity:1;transform:translateY(0)}}@media(min-width:641px){.topbar{top:22px;width:min(calc(100% - 46px),900px)}.character-image{bottom:calc(var(--safe) + 139px);width:280px;height:280px}.dialogue-area{bottom:calc(var(--safe) + 151px);width:min(calc(100% - 46px),620px)}.choices{bottom:calc(var(--safe) + 40px);width:min(calc(100% - 46px),620px)}.dialogue-card{min-height:112px;padding:30px 28px 18px}.text{min-height:62px;font-size:19px}}

<body>
<div class="screen" id="screen"><div class="background"></div><img class="scene-background" id="scene-background" alt="Фон сцены"><img class="character-image" id="character-image" alt="Персонаж"><header class="topbar"><div class="top-group"><span class="label">Название</span><span class="value">Странный выходной</span></div><div class="top-group right"><span class="label">Дата</span><span class="value">19.09.2026</span></div></header><div class="chapter-mark">25</div><div class="ui"><div class="dialogue-area"><section class="dialogue-card" id="dialogue-card"><div class="name" id="character-name">Даша</div><div class="kind">Dialogue</div><p class="text" id="dialogue-text"></p><div class="hint" id="hint"><i></i><span>нажмите, чтобы продолжить</span><i></i></div></section></div><section class="choices" id="choices" hidden><div class="choice-title">Make a choice</div><div class="choice-list" id="choice-list"></div></section><footer class="footer"><button class="restart" id="restart" type="button">Restart story</button><span id="progress">morning</span></footer></div></div>
<script>
const ASSET=(name)=>`./${name}`;
const N={dasha:'Даша',polina:'Полина',vasya:'Вася',olesya:'Олеся',veronika:'Вероника',parents:'Мама и папа',serge:'Серёжа'};
const BG={bedroom:ASSET('bedroom.jpg'),kitchen:ASSET('Kitchen.jpg'),park:ASSET('Park.jpg'),studio:ASSET('Studio.jpg'),street:ASSET('Streat.jpg'),car:ASSET('Auto.jpg'),family:ASSET('Fam_home.jpg'),phone:ASSET('Streat.jpg')};
const CHAR={dasha_morning:ASSET('dasha_morning.jpg'),dasha_playful:ASSET('Dasha_igrivay.jpg'),dasha_calm:ASSET('dasha_main_in_suit.jpg'),dasha_surprised:ASSET('dasha_ydivlenie.jpg'),polina:ASSET('Polina.jpg'),vasya:ASSET('Vasy.jpg'),olesya:ASSET('Olesy.jpg'),veronika:ASSET('Veronika.jpg'),serge:ASSET('Serega.jpg'),parents:ASSET('Parents.jpg')};
const SCENES={
start:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Сегодня у меня день рождения…\nМожно я ещё немного полежу? За окном только начинает светлеть, а мне хочется задержать это тихое утро.',choices:[['Остаться в постели','lazy'],['Встать и начать день','active']]},
lazy:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Первые десять минут праздника официально объявляю временем безделья. Телефон можно не проверять, планы — не открывать. Просто послушать, как просыпается дом.',next:'kitchen'},
active:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Ладно, встаю. Сегодня попробую начать день без спешки — не бежать впереди себя, а заметить всё хорошее, что он приготовил.',next:'kitchen'},
kitchen:{actor:'dasha',place:'kitchen',portrait:'dasha_playful',text:'Так… что приготовить Серёже? Или сегодня всё-таки должны готовить мне? День рождения бывает раз в году — можно немного себя побаловать.',choices:[['Приготовить завтрак Серёже','serge_morning'],['Сегодня готовят мне','coffee']]},
serge_morning:{actor:'serge',place:'kitchen',portrait:'serge',text:'Ты уже проснулась? С днём рождения, именинница. Сегодня будет хороший день. Я почему-то уверен.',next:'dasha_suspicious'},
dasha_suspicious:{actor:'dasha',place:'kitchen',portrait:'dasha_surprised',text:'Спасибо… Но почему ты так загадочно улыбаешься? У тебя вид, будто ты уже прожил этот день за меня.',next:'coffee'},
coffee:{actor:'dasha',place:'kitchen',portrait:'dasha_calm',text:'Завтрак закончился. Без кофе я дальше не двигаюсь. Нужно выбрать правильное настроение для подозрительно насыщенного дня.',choices:[['Капучино — мягко','cappuccino'],['Американо — крепко','americano']]},
cappuccino:{actor:'dasha',place:'kitchen',portrait:'dasha_calm',text:'Капучино. Сегодня хочется чего-то мягкого и спокойного — чтобы день начался с маленького удовольствия.',next:'plans'},americano:{actor:'dasha',place:'kitchen',portrait:'dasha_calm',text:'Американо. Если в воздухе назревает заговор, я должна быть готова его раскрыть.',next:'plans'},
plans:{actor:'dasha',place:'street',portrait:'dasha_surprised',text:'Кофе выпит, дома я долго не усидела. Чем заняться дальше? Можно пойти туда, где меня никто не ждёт… или как раз туда, где уже ждут.',choices:[['Пойти на прогулку','polina_meeting'],['Пойти на занятие','studio_meeting']]},
polina_meeting:{actor:'dasha',place:'park',portrait:'dasha_surprised',text:'Я вышла прогуляться. Воздух прохладный, листья шуршат, всё выглядит слишком красиво для обычного дня. А потом я заметила Полину.',next:'polina_intro'},
polina_intro:{actor:'dasha',place:'park',portrait:'dasha_surprised',text:'Полина? Ты тоже здесь? И почему у тебя в руках кофе и пакет с подарочной лентой?',next:'polina_answer'},
polina_answer:{actor:'polina',place:'park',portrait:'polina',text:'Какая встреча! Я как раз проходила мимо. Не смотри так, будто я не умею случайно оказываться в нужном месте.',next:'polina_suspicion'},
polina_suspicion:{actor:'dasha',place:'park',portrait:'dasha_surprised',text:'С кофе и подарком? Это уже не случайность. Это плохо замаскированный план.',next:'polina_1'},
polina_1:{actor:'polina',place:'park',portrait:'polina',text:'С днём рождения, моя дорогая Дашуля! Мы дружим со школьных времён так давно, что я уже не представляю свою жизнь без тебя.',next:'polina_2'},
polina_2:{actor:'polina',place:'park',portrait:'polina',text:'Спасибо за нашу дружбу, разговоры и поддержку. Рядом с тобой можно быть собой. И помни: что бы ни случилось, я всегда рядом!',next:'polina_3'},
polina_3:{actor:'polina',place:'park',portrait:'polina',text:'Будь самой счастливой, любимой, радостной и здоровой. Цвети, сияй и озаряй мир своей улыбкой. Хотя… с улыбкой у тебя и так всё отлично!',next:'after_polina'},
after_polina:{actor:'dasha',place:'park',portrait:'dasha_playful',text:'Полина сияет так, будто сама только что получила подарок. Мы обнимаемся, а я всё сильнее думаю: почему сегодня все знают что-то, чего не знаю я?',next:'street_transition'},
studio_meeting:{actor:'dasha',place:'studio',portrait:'dasha_calm',text:'На занятие я всё-таки пришла. Здесь пахнет кофе, деревом и чем-то новым. Интересно, кого я встречу?',next:'vasya_1'},
vasya_1:{actor:'vasya',place:'studio',portrait:'vasya',text:'Даша, с днём рождения! Живи в моменте, влюбляйся в каждый свой день и не откладывай радость на потом.',next:'vasya_2'},
vasya_2:{actor:'vasya',place:'studio',portrait:'vasya',text:'Пусть самые дерзкие мечты воплощаются легко, а близкие поддерживают каждое твоё начинание — даже самое смелое.',next:'vasya_3'},
vasya_3:{actor:'vasya',place:'studio',portrait:'vasya',text:'Пусть желания исполняются почти по мановению волшебной палочки. И все мои поздравления умножаю на 25 — возраст обязывает!',next:'after_vasya'},
after_vasya:{actor:'dasha',place:'studio',portrait:'dasha_calm',text:'Я смеюсь, но внутри становится тепло. Вася умеет напомнить: иногда самый важный план — просто не забывать жить сейчас.',next:'olesya_1'},
olesya_1:{actor:'olesya',place:'studio',portrait:'olesya',text:'Дашулик, поздравляю тебя с днём рождения! Хочется пожелать тебе ощущения праздника каждый день — даже в самые обычные будни.',next:'olesya_2'},
olesya_2:{actor:'olesya',place:'studio',portrait:'olesya',text:'Никогда не останавливайся на достигнутом, покоряй новые вершины, больше путешествуй, отдыхай и проводи время с близкими.',next:'olesya_3'},
olesya_3:{actor:'olesya',place:'studio',portrait:'olesya',text:'И конечно же… крепчайшего здоровья и огромного-огромного счастья! Восхищаюсь твоим умением дипломатично вести диалоги со всякими неприятными людьми. Оставайся такой же невероятно прекрасной девушкой!',next:'street_transition'},
street_transition:{actor:'dasha',place:'street',portrait:'dasha_playful',text:'Слишком много случайностей для одного дня. Каждая встреча будто появляется в нужную секунду. Может, этот день кем-то продуман?',next:'veronika_1'},
veronika_1:{actor:'veronika',place:'street',portrait:'veronika',text:'Прекрасный, чудесный, очаровательный, светлый и дорогой мой человек… С днём рождения тебя!',next:'veronika_2'},
veronika_2:{actor:'veronika',place:'street',portrait:'veronika',text:'Желаю, чтобы все твои самые сокровенные мечты сбылись. Пусть жизнь будет наполнена яркими эмоциями, рядом с которыми любые невзгоды кажутся сущими пустяками.',next:'veronika_3'},
veronika_3:{actor:'veronika',place:'street',portrait:'veronika',text:'Пусть мир как можно чаще показывает тебе свою светлую сторону, а фортуна подбрасывает монетку именно той стороной, которую ты загадала.',next:'veronika_4'},
veronika_4:{actor:'veronika',place:'street',portrait:'veronika',text:'В суете я иногда забываю, как сильно мне повезло. Наша работа даёт мне возможность почти каждый день быть рядом с таким светлым и замечательным человеком, как ты.',next:'veronika_5'},
veronika_5:{actor:'veronika',place:'street',portrait:'veronika',text:'Любви и счастья тебе, котёнка. Люблю тебя! И по большому секрету: ни по какому сотруднику мне Кирилл не писал. Это всё твой брат затеял, чтобы сделать тебе сюрприз. Я проболталась, но ты ему не говори!',next:'dasha_secret'},
dasha_secret:{actor:'dasha',place:'street',portrait:'dasha_surprised',text:'Так вот почему все сегодня так странно улыбаются… Мой брат?! Ладно, секрет сохраню. Но у меня теперь к нему и к Серёже пара очень важных вопросов.',next:'serge_call'},
serge_call:{actor:'serge',place:'phone',portrait:'serge',text:'Что именно ты знаешь? Ладно, сдаюсь. Это идея твоего брата, я просто помогал ему не спалиться и подвозил тебя по маршруту. Но главный сюрприз всё ещё впереди, так что не порти ему малину.',next:'evening'},
evening:{actor:'dasha',place:'street',portrait:'dasha_calm',text:'К вечеру всё стало ясно. Все эти встречи были совсем не случайными. Кто-то весь день собирал для меня маленькие кусочки праздника.',next:'serge_arrives'},
serge_arrives:{actor:'serge',place:'street',portrait:'serge',text:'Я подъехал. Собирайся, едем к родителям. Твой брат уже там, и я обещал ему, что мы не опоздаем. Просто доверься мне хотя бы на этот вечер.',next:'car'},
car:{actor:'dasha',place:'car',portrait:'dasha_calm',text:'Это тоже часть плана? Я уже почти перестала удивляться, но всё равно хочу хотя бы одну подсказку. Куда мы едем и почему ты так стараешься не улыбаться?',next:'family_arrival'},
family_arrival:{actor:'dasha',place:'family',portrait:'dasha_surprised',text:'Дверь открылась — и я сразу услышала знакомые голоса. Родители, брат, накрытый стол, тёплый свет и ощущение, будто весь день тихо вёл меня именно сюда.',next:'parents_1'},
parents_1:{actor:'parents',place:'family',portrait:'parents',text:'Двадцать пять лет назад мы пережили самое большое чудо в своей жизни: на свет появились сразу двое — ты и твой брат. Двойное счастье, двойная любовь, двойная ответственность.',next:'parents_2'},
parents_2:{actor:'parents',place:'family',portrait:'parents',text:'С тех пор вы всегда рядом: не только по дате рождения, но и по духу. Когда ты родилась, мы держали на руках крошечный комочек счастья.',next:'parents_3'},
parents_3:{actor:'parents',place:'family',portrait:'parents',text:'Мы боялись сделать что-то не так, боялись, что ты вырастешь и перестанешь нуждаться в нас. Сегодня тебе 25. Ты стала взрослой, красивой и невероятно сильной.',next:'parents_4'},
parents_4:{actor:'parents',place:'family',portrait:'parents',text:'Мы хотим сказать тебе не «будь послушной», а «будь собой». В 25 лет мир будет пытаться навязать тебе правила: когда выходить замуж, кем работать, как выглядеть. Не слушай. Слушай своё сердце.',next:'parents_5'},
parents_5:{actor:'parents',place:'family',portrait:'parents',text:'Мы вырастили тебя не для того, чтобы ты соответствовала чужим ожиданиям, а для того, чтобы ты была счастлива. Спасибо тебе за то, что ты выбрала нас своими родителями.',next:'parents_6'},
parents_6:{actor:'parents',place:'family',portrait:'parents',text:'С 25-летием, наша девочка. Мы всегда рядом, даже если ты улетишь на край света. Хотя сначала всё равно позвони, чтобы мы знали, что ты поела.',next:'dasha_parents'},
dasha_parents:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Спасибо, мам, пап… Я всегда буду вашей девочкой. Даже если официально мне уже двадцать пять и я весь день пыталась делать вид, что понимаю, что происходит.',next:'reflection'},
reflection:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Все случайные встречи привели меня сюда — к людям, которые знают меня разной и всё равно любят. Наверное, это и есть самый настоящий подарок.',next:'serge_before_toast'},
serge_before_toast:{actor:'serge',place:'family',portrait:'serge',text:'Я просто помогал твоему брату собрать этот пазл. Но главный праздник придумали не мы. Он появился в тот день, когда ты родилась.',next:'toast_intro'},
toast_intro:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Серёжа, теперь твоя очередь. Только не делай вид, что это обычный тост — после такого дня мы знаем, что у тебя всё превращается в план.',next:'toast_stage'},
toast_stage:{actor:'serge',place:'family',portrait:'serge',text:'Серёжа встаёт из-за стола. Он смотрит на меня с нежностью и лёгким волнением, берёт бокал и начинает говорить.',next:'gifts'},
gifts:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Дальше будут слова будущего мужа, а потом — подарки от семьи. Некоторые сюрпризы нельзя уместить на экране. Их можно только принять и сохранить.',final:true}
};
const $=s=>document.querySelector(s);const e={screen:$('#screen'),bg:$('#scene-background'),char:$('#character-image'),name:$('#character-name'),text:$('#dialogue-text'),choices:$('#choice-list'),panel:$('#choices'),hint:$('#hint'),card:$('#dialogue-card'),progress:$('#progress')};let current='start',locked=false,timer=null;
function render(id){const s=SCENES[id];if(!s||locked)return;const old=SCENES[current];const fade=!old||old.actor!==s.actor||old.place!==s.place;locked=true;clearTimeout(timer);if(fade){e.bg.classList.add('is-changing');e.char.classList.add('is-changing');e.card.classList.add('is-changing');e.text.classList.add('is-changing');e.name.classList.add('is-changing')}else e.text.classList.add('is-line-changing');timer=setTimeout(()=>{current=id;e.bg.src=BG[s.place]||BG.street;e.bg.alt=s.place;e.char.src=CHAR[s.portrait]||CHAR.dasha_calm;e.char.alt=N[s.actor]||s.actor;e.name.textContent=N[s.actor]||s.actor;e.text.textContent=s.text;e.progress.textContent=id;if(fade){e.bg.onload=()=>e.bg.classList.remove('is-changing');e.bg.onerror=()=>e.bg.classList.remove('is-changing');e.char.onload=()=>e.char.classList.remove('is-changing');e.char.onerror=()=>e.char.classList.remove('is-changing');e.card.classList.remove('is-changing');e.text.classList.remove('is-changing');e.name.classList.remove('is-changing')}e.text.classList.remove('is-line-changing');s.choices?showChoices(s.choices):hideChoices(s);timer=setTimeout(()=>locked=false,fade?500:210)},fade?300:115)}
function showChoices(items){e.panel.hidden=false;e.hint.style.visibility='hidden';e.choices.replaceChildren();items.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=label;b.onclick=ev=>{ev.stopPropagation();if(locked)return;e.choices.querySelectorAll('button').forEach(x=>x.disabled=true);render(next)};e.choices.appendChild(b)})}function hideChoices(s){e.panel.hidden=true;e.choices.replaceChildren();e.hint.style.visibility='visible';e.hint.querySelector('span').textContent=s.final?'праздник продолжается':'нажмите, чтобы продолжить'}e.screen.onclick=ev=>{if(ev.target.closest('button'))return;const s=SCENES[current];if(!locked&&!s.choices&&s.next)render(s.next)};$('#restart').onclick=ev=>{ev.stopPropagation();clearTimeout(timer);locked=false;current='start';render('start')};render('start');
</script>
