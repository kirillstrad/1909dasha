 id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E")}.top{position:absolute;top:18px;left:50%;z-index:8;width:calc(100% - 32px);display:flex;justify-content:space-between;transform:translateX(-50%);color:var(--muted);font-size:8px;letter-spacing:.19em;text-transform:uppercase;text-shadow:0 2px 9px #000}.top span:last-child{color:var(--soft)}.splash-center{position:absolute;top:49%;left:50%;z-index:5;width:min(92%,520px);transform:translate(-50%,-54%);text-align:center;transition:opacity .6s ease,transform .85s cubic-bezier(.22,.61,.36,1)}.screen.leaving .splash-center{opacity:0;transform:translate(-50%,-58%) scale(.97)}.eyebrow{margin-bottom:17px;color:var(--muted);font-size:10px;letter-spacing:.3em;text-transform:uppercase}.logo{position:relative;display:grid;place-items:center;width:clamp(124px,24vw,172px);height:clamp(124px,24vw,172px);margin:0 auto 23px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:radial-gradient(circle,rgba(183,148,112,.23),rgba(20,18,16,.22) 62%,rgba(7,7,7,.12));box-shadow:0 0 0 6px rgba(255,255,255,.025),0 0 42px rgba(172,128,83,.16),inset 0 0 28px rgba(255,255,255,.06);overflow:hidden}.logo:before{content:"";position:absolute;inset:11px;border:1px solid rgba(255,255,255,.14);border-radius:50%}.logo:after{content:"";position:absolute;inset:-14px;border:1px dashed rgba(180,145,105,.16);border-radius:50%}.logo-number{position:absolute;left:50%;top:47%;z-index:2;width:100%;transform:translate(-50%,-50%);color:#f2e7db;font:italic clamp(45px,8vw,70px)/.9 Georgia,serif;letter-spacing:-.08em;text-indent:-.08em;text-align:center;text-shadow:0 3px 13px #000;white-space:nowrap}.splash-title{margin:0;color:var(--text);font:400 clamp(27px,5.6vw,48px)/1.06 Georgia,serif;text-shadow:0 3px 14px #000}.subtitle{max-width:410px;margin:12px auto 0;color:var(--soft);font:400 clamp(14px,2.2vw,17px)/1.4 Georgia,serif}.meta{display:flex;justify-content:center;gap:17px;margin-top:17px;color:var(--muted);font-size:8px;letter-spacing:.13em;text-transform:uppercase}.start{position:absolute;left:50%;bottom:calc(var(--safe) + 26px);z-index:100;width:min(calc(100% - 32px),360px);min-height:54px;padding:0 24px;transform:translateX(-50%);border:1px solid rgba(255,255,255,.42);border-radius:999px;color:#f4e9de;background:linear-gradient(135deg,rgba(178,145,108,.96),rgba(92,67,47,.94));box-shadow:0 12px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;pointer-events:auto;touch-action:manipulation;user-select:none;transition:opacity .45s ease,transform .7s ease,filter .25s ease}.screen.leaving .start{opacity:0;transform:translateX(-50%) translateY(18px)}.start:hover{filter:brightness(1.12)}.start:active{transform:translateX(-50%) scale(.97)}.game-ui{position:absolute;inset:0;z-index:5}.character{position:absolute;left:50%;bottom:calc(var(--safe) + 132px);z-index:3;width:min(86vw,430px);height:min(120svh,1060px);object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:drop-shadow(0 18px 28px rgba(0,0,0,.5));pointer-events:none;transition:opacity .72s ease,transform .72s ease}.character.changing{opacity:0;transform:translateX(-50%) translateY(14px) scale(.975)}.dialogue-area{position:absolute;left:50%;bottom:calc(var(--safe) + 154px);z-index:8;width:calc(100% - 28px);max-width:620px;transform:translateX(-50%);pointer-events:none}.dialogue{position:relative;z-index:9;min-height:108px;max-height:22svh;padding:28px 18px 16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.01)),var(--glass)!important;box-shadow:0 16px 35px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(21px);-webkit-backdrop-filter:blur(21px);pointer-events:auto;transition:opacity .43s ease,transform .43s ease}.dialogue.changing{opacity:0;transform:translateY(10px) scale(.987)}.name{position:absolute;top:-15px;left:17px;padding:6px 13px;color:#f0e7de;background:#251f1bf5!important;border:1px solid #ffffff47;border-radius:999px;box-shadow:0 7px 15px #0009;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.text{display:flex;align-items:center;justify-content:center;min-height:58px;max-height:12svh;margin:0;overflow:hidden;color:var(--text);font:500 clamp(14px,1.9vw,19px)/1.3 Georgia,serif;text-align:center;white-space:pre-line;overflow-wrap:anywhere}.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted);font-size:7px;letter-spacing:.13em;text-transform:uppercase}.hint i{width:22px;height:1px;background:var(--accent)}.choices{position:absolute;left:50%;bottom:calc(var(--safe) + 39px);z-index:12;width:calc(100% - 28px);max-width:620px;transform:translateX(-50%)}.choices[hidden]{display:none}.choice-list{display:grid;gap:6px}.choice{width:100%;min-height:36px;padding:8px 11px;color:var(--soft);background:linear-gradient(135deg,#ffffff17,#ffffff03),var(--button);border:1px solid #ffffff26;border-radius:14px;box-shadow:0 8px 20px #0008;cursor:pointer;font-size:11px}.footer{position:absolute;left:50%;bottom:6px;z-index:13;width:calc(100% - 28px);display:flex;justify-content:space-between;transform:translateX(-50%);color:var(--muted);font-size:7px;text-transform:uppercase}.restart{padding:5px 8px;color:var(--soft);background:#141414e0;border:1px solid #ffffff29;border-radius:999px;cursor:pointer;font-size:7px;text-transform:uppercase}@media(min-width:641px){.character{width:min(72vw,560px);height:min(120svh,1060px);bottom:calc(var(--safe) + 122px)}.dialogue-area{bottom:calc(var(--safe) + 146px);width:min(calc(100% - 46px),620px)}.choices{bottom:calc(var(--safe) + 39px);width:min(calc(100% - 46px),620px)}}

<div class="page"><section class="screen active splash" id="splash"><img class="splash-bg" src="https://ik.imagekit.io/lqpsskjzw/bedroom.jpg" alt="Осенняя спальня"><div class="overlay"></div><div class="grain"></div><div class="top"><span>Episode 25</span><span>19.09.2026</span></div><main class="splash-center"><div class="eyebrow">История одного дня</div><div class="logo"><span class="logo-number">25</span></div><h1 class="splash-title">Странный выходной</h1><p class="subtitle">Иногда самые важные сюрпризы начинаются с обычного утра.</p><div class="meta"><span>тёплая история</span><span>•</span><span>10–13 минут</span></div></main><button class="start" id="start" type="button">Начать этот день</button></section><section class="screen game" id="game"><img class="scene-bg" id="scene-bg" alt=""><div class="overlay"></div><img class="character" id="character" alt=""><div class="game-ui"><div class="top"><span>Episode 25</span><span>19.09.2026</span></div><div class="dialogue-area"><section class="dialogue" id="dialogue"><div class="name" id="name"></div><p class="text" id="text"></p><div class="hint"><i></i><span id="hint-text">нажмите, чтобы продолжить</span><i></i></div></section></div><section class="choices" id="choices" hidden><div class="choice-list" id="choice-list"></div></section><footer class="footer"><button class="restart" id="restart" type="button">Начать сначала</button><span id="progress"></span></footer></div></section></div>
<script>
const IMAGEKIT='https://ik.imagekit.io/lqpsskjzw/';const asset=n=>IMAGEKIT+n;const N={dasha:'Даша',polina:'Полина',vasya:'Вася',olesya:'Олеся',veronika:'Вероника',parents:'Мама и папа',brother:'Брат Даши',serge:'Серёжа'};const BG={bedroom:asset('bedroom.jpg'),kitchen:asset('Kitchen.jpg'),park:asset('Park.jpg'),studio:asset('Studio.jpg'),street:asset('Streat.jpg'),car:asset('Auto.jpg'),family:asset('Fam_home.jpg'),phone:asset('Streat.jpg')};const CHAR={dasha_morning:asset('dasha_morning.png'),dasha_playful:asset('Dasha_igrivay.png'),dasha_calm:asset('dasha_main_in_suit.png'),dasha_surprised:asset('dasha_ydivlenie.png'),polina:asset('Polina.png'),vasya:asset('Vasy.png'),olesya:asset('Olesy.png'),veronika:asset('Veronika.png'),serge:asset('Serega.png'),parents:asset('Parents.png'),brother:asset('Parents.png')};
const S={start:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Сегодня у меня день рождения…\nМожно я ещё немного полежу? За окном только начинает светлеть, а мне хочется задержать это тихое утро.',choices:[['Остаться в постели','lazy'],['Встать и начать день','active']]},lazy:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Первые десять минут праздника официально объявляю временем безделья. Телефон можно не проверять, планы — не открывать. Просто послушать, как просыпается дом.',next:'kitchen'},active:{actor:'dasha',place:'bedroom',portrait:'dasha_morning',text:'Ладно, встаю. Сегодня попробую начать день без спешки — не бежать впереди себя, а заметить всё хорошее, что он приготовил.',next:'kitchen'},kitchen:{actor:'dasha',place:'kitchen',portrait:'dasha_playful',text:'Так… что приготовить Серёже? Или сегодня всё-таки должны готовить мне? День рождения бывает раз в году — можно немного себя побаловать.',choices:[['Приготовить завтрак Серёже','cook_route'],['Сегодня я принимаю заботу','care_route']]},cook_route:{actor:'dasha',place:'kitchen',portrait:'dasha_playful',text:'Начну с заботы. Хотя Серёжа слишком спокойно принимает завтрак — будто знает, что сегодня ему ещё придётся оправдываться.',next:'serge_morning'},care_route:{actor:'dasha',place:'kitchen',portrait:'dasha_playful',text:'Сегодня я официально именинница и имею право ничего не готовить. Особенно если кто-то рядом так подозрительно улыбается.',next:'serge_morning'},serge_morning:{actor:'serge',place:'kitchen',portrait:'serge',text:'С днём рождения, именинница. Сегодня будет хороший день. И да, я ничего не знаю. Пока.',choices:[['Сделать вид, что поверила','coffee_soft'],['Запомнить это «пока»','coffee_suspicious']]},coffee_soft:{actor:'dasha',place:'kitchen',portrait:'dasha_calm',text:'Я делаю вид, что поверила. Но его улыбка остаётся рядом — слишком спокойная для человека, который ничего не знает.',next:'coffee_choice'},coffee_suspicious:{actor:'dasha',place:'kitchen',portrait:'dasha_surprised',text:'Я запоминаю это «пока». В день рождения особенно полезно собирать маленькие улики.',next:'coffee_choice'},coffee_choice:{actor:'dasha',place:'kitchen',portrait:'dasha_calm',text:'Без кофе расследование не начнётся. Что выбрать для такого подозрительно насыщенного утра?',choices:[['Капучино — мягкое настроение','walk_route'],['Американо — режим расследования','walk_route']]},walk_route:{actor:'dasha',place:'street',portrait:'dasha_surprised',text:'Кофе выпит, и дома я больше не усидела. Я выбираю маршрут наугад — хотя сегодня уже начинаю подозревать, что случайностей не бывает.',choices:[['Сначала пойти в парк','polina_meeting'],['Сначала заглянуть в студию','studio_first']]},polina_meeting:{actor:'dasha',place:'park',portrait:'dasha_surprised',text:'В парке прохладно и красиво. На дорожке появляется Полина — с кофе и подарком, который слишком аккуратно спрятан в пакете.',next:'polina_intro'},polina_intro:{actor:'polina',place:'park',portrait:'polina',text:'Какая встреча! Я как раз проходила мимо. Не смотри так, будто я не умею случайно оказываться в нужном месте.',choices:[['Спросить про подарок','polina_1'],['Сделать вид, что ничего не заметила','polina_1']]},polina_1:{actor:'polina',place:'park',portrait:'polina',text:'С днём рождения, моя дорогая Дашуля! Мы дружим со школьных времён так давно, что я уже не представляю свою жизнь без тебя.',next:'polina_2'},polina_2:{actor:'polina',place:'park',portrait:'polina',text:'Спасибо за нашу дружбу, разговоры и поддержку. Рядом с тобой можно быть собой. И помни: что бы ни случилось, я всегда рядом!',next:'polina_3'},polina_3:{actor:'polina',place:'park',portrait:'polina',text:'Будь счастливой, любимой, радостной и здоровой. Цвети, сияй и озаряй мир своей улыбкой. Хотя… с улыбкой у тебя и так всё отлично!',next:'after_polina'},after_polina:{actor:'dasha',place:'park',portrait:'dasha_playful',text:'Полина сияет так, будто сама только что получила подарок. Мы обнимаемся, а я всё сильнее думаю: почему сегодня все знают что-то, чего не знаю я?',next:'studio_first'},studio_first:{actor:'dasha',place:'studio',portrait:'dasha_calm',text:'Я захожу в студию, надеясь хотя бы ненадолго спрятаться от странностей этого дня. Но внутри уже кто-то ждёт.',next:'vasya_first'},vasya_first:{actor:'vasya',place:'studio',portrait:'vasya',text:'Даша, с днём рождения! Живи в моменте, влюбляйся в каждый свой день и не откладывай радость на потом.',next:'vasya_choice'},vasya_choice:{actor:'vasya',place:'studio',portrait:'vasya',text:'Пусть самые дерзкие мечты воплощаются легко, а близкие поддерживают каждое твоё начинание. И пусть желания исполняются почти по мановению волшебной палочки.',choices:[['Спросить, кто её прислал','vasya_ending'],['Поблагодарить и не выдавать подозрения','vasya_ending']]},vasya_ending:{actor:'vasya',place:'studio',portrait:'vasya',text:'А все мои поздравления я умножаю на 25 — возраст обязывает! Развитие важно, но время с близкими тоже нельзя откладывать.',next:'olesya_meeting'},olesya_meeting:{actor:'olesya',place:'studio',portrait:'olesya',text:'Дашулик, с днём рождения! Желаю ощущения праздника каждый день — даже в самые обычные будни.',next:'olesya_2'},olesya_2:{actor:'olesya',place:'studio',portrait:'olesya',text:'Не останавливайся на достигнутом, покоряй новые вершины, больше путешествуй, отдыхай и проводи время с близкими.',next:'olesya_choice'},olesya_choice:{actor:'olesya',place:'studio',portrait:'olesya',text:'Крепчайшего здоровья и огромного счастья! А ещё восхищаюсь твоим умением дипломатично разговаривать со всякими неприятными людьми.',choices:[['Рассмеяться и принять комплимент','olesya_ending'],['Сказать, что это навык выживания','olesya_ending']]},olesya_ending:{actor:'olesya',place:'studio',portrait:'olesya',text:'Оставайся такой же невероятно прекрасной девушкой! А теперь иди дальше — кажется, следующий человек тоже пришёл не просто так.',next:'street_transition'},street_transition:{actor:'dasha',place:'street',portrait:'dasha_playful',text:'Полина, Вася, Олеся… Слишком много встреч для одного обычного выходного. Каждая появляется в нужную секунду. Кто-то явно знает сценарий лучше меня.',next:'veronika_1'},veronika_1:{actor:'veronika',place:'street',portrait:'veronika',text:'Прекрасный, чудесный, очаровательный, светлый и дорогой мой человек… С днём рождения тебя!',next:'veronika_2'},veronika_2:{actor:'veronika',place:'street',portrait:'veronika',text:'Пусть сбудутся самые сокровенные мечты. Пусть жизнь будет наполнена яркими эмоциями, рядом с которыми невзгоды кажутся сущими пустяками.',next:'veronika_3'},veronika_3:{actor:'veronika',place:'street',portrait:'veronika',text:'Пусть мир как можно чаще показывает светлую сторону, а фортуна подбрасывает монетку именно той стороной, которую ты загадала.',next:'veronika_4'},veronika_4:{actor:'veronika',place:'street',portrait:'veronika',text:'В суете я иногда забываю, как сильно мне повезло. Наша работа подарила мне возможность почти каждый день быть рядом с таким светлым человеком, как ты.',next:'veronika_choice'},veronika_choice:{actor:'veronika',place:'street',portrait:'veronika',text:'Любви и счастья тебе, котёнка. Люблю тебя! И по большому секрету: ни по какому сотруднику мне Кирилл не писал. Это всё твой брат затеял, чтобы сделать тебе сюрприз. Я проболталась, но ты ему не говори!',choices:[['Спросить, где брат','dasha_secret'],['Сделать вид, что ничего не услышала','dasha_secret']]},dasha_secret:{actor:'dasha',place:'street',portrait:'dasha_surprised',text:'Так вот почему все сегодня так странно улыбаются… Мой брат?! Ладно, секрет сохраню. Но у меня появились вопросы и к нему, и к Серёже.',next:'serge_call'},serge_call:{actor:'serge',place:'phone',portrait:'serge',text:'Ладно, сдаюсь. Это идея твоего брата. Я просто помогал ему не спалиться, следил за маршрутом и делал вид, что ничего не происходит.',choices:[['Попросить сказать правду до конца','serge_confession'],['Сказать, что всё равно ему доверяешь','serge_confession']]},serge_confession:{actor:'serge',place:'phone',portrait:'serge',text:'Твой брат уже ждёт у родителей. Я сейчас подъеду за тобой. И да — главный сюрприз ещё впереди. Не порти ему малину, пожалуйста.',next:'evening'},evening:{actor:'dasha',place:'street',portrait:'dasha_calm',text:'Теперь всё складывается. Брат собрал этот день по кусочкам, а Серёжа помог провести меня по маршруту. Странный выходной оказался очень хорошо спланированным.',next:'serge_arrives'},serge_arrives:{actor:'serge',place:'street',portrait:'serge',text:'Я подъехал. Собирайся, едем к родителям. Твой брат уже там и делает вид, что совершенно спокоен.',next:'car'},car:{actor:'dasha',place:'car',portrait:'dasha_calm',text:'Это тоже часть плана? Я уже почти перестала удивляться, но всё равно хочу хотя бы одну подсказку. Что меня ждёт за этой дверью?',choices:[['Попросить подсказку','family_arrival'],['Сделать вид, что всё понятно','family_arrival']]},family_arrival:{actor:'dasha',place:'family',portrait:'dasha_surprised',text:'Дверь открывается. Я слышу знакомые голоса: родители, брат, накрытый стол и тот самый тёплый свет, который сразу возвращает в детство.',next:'parents_1'},parents_1:{actor:'parents',place:'family',portrait:'parents',text:'Двадцать пять лет назад произошло самое большое чудо в нашей жизни: на свет появились сразу двое — ты и твой брат. Двойное счастье, двойная любовь, двойная ответственность.',next:'parents_2'},parents_2:{actor:'parents',place:'family',portrait:'parents',text:'С тех пор вы всегда рядом: не только по дате рождения, но и по духу. Когда ты родилась, мы держали на руках крошечный комочек счастья.',next:'parents_3'},parents_3:{actor:'parents',place:'family',portrait:'parents',text:'Мы боялись сделать что-то не так, боялись, что ты вырастешь и перестанешь нуждаться в нас. Сегодня тебе 25. Ты стала взрослой, красивой и невероятно сильной.',next:'parents_4'},parents_4:{actor:'parents',place:'family',portrait:'parents',text:'Мы хотим сказать тебе не «будь послушной», а «будь собой». В 25 лет мир будет пытаться навязать тебе правила: когда выходить замуж, кем работать, как выглядеть. Не слушай. Слушай своё сердце.',next:'parents_5'},parents_5:{actor:'parents',place:'family',portrait:'parents',text:'Мы вырастили тебя не для чужих ожиданий, а для того, чтобы ты была счастлива. Спасибо, что ты выбрала нас своими родителями.',next:'parents_6'},parents_6:{actor:'parents',place:'family',portrait:'parents',text:'С 25-летием, наша девочка. Мы всегда рядом, даже если ты улетишь на край света. Хотя сначала всё равно позвони, чтобы мы знали, что ты поела.',next:'brother_reveal'},brother_reveal:{actor:'brother',place:'family',portrait:'brother',text:'Ну что, именинница? Я старался сделать всё незаметно. Правда, судя по твоему лицу, с конспирацией у меня есть куда расти.',next:'dasha_parents'},dasha_parents:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Спасибо, мам, пап… И тебе спасибо. Теперь я понимаю, почему все сегодня так странно себя вели. Я всегда буду вашей девочкой, даже если мне уже двадцать пять.',next:'reflection'},reflection:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Все случайные встречи привели меня сюда — к людям, которые знают меня разной и всё равно любят. Кажется, это и есть самый настоящий подарок.',next:'toast_intro'},toast_intro:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Серёжа, теперь твоя очередь. Только не делай вид, что это обычный тост: после такого дня мы знаем, что у тебя всё превращается в план.',next:'toast_stage'},toast_stage:{actor:'serge',place:'family',portrait:'serge',text:'Серёжа встаёт из-за стола, берёт бокал и смотрит на Дашу с нежностью и лёгким волнением. Похоже, сейчас начнётся самая важная часть вечера.',next:'gifts'},gifts:{actor:'dasha',place:'family',portrait:'dasha_calm',text:'Дальше будут слова будущего мужа, а потом — подарки от семьи. Некоторые сюрпризы нельзя уместить на экране. Их можно только принять и сохранить.',final:true}};
const $=s=>document.querySelector(s),e={splash:$('#splash'),game:$('#game'),bg:$('#scene-bg'),char:$('#character'),dialogue:$('#dialogue'),name:$('#name'),text:$('#text'),choices:$('#choices'),list:$('#choice-list'),hint:$('#hint-text'),progress:$('#progress')};let current='start',locked=false,timer=null;
function image(img,url,alt){img.onload=()=>{img.classList.remove('changing');img.style.display='block'};img.onerror=()=>{console.error('ImageKit file not found:',url);img.style.display='none';img.classList.remove('changing')};img.src=url;img.alt=alt}
function show(id){const s=S[id];if(!s||locked)return;const old=S[current],fade=!old||old.actor!==s.actor||old.place!==s.place;locked=true;clearTimeout(timer);if(fade){e.bg.classList.add('changing');e.char.classList.add('changing');e.dialogue.classList.add('changing');e.text.classList.add('changing')}else e.text.classList.add('changing');timer=setTimeout(()=>{current=id;image(e.bg,BG[s.place],s.place);image(e.char,CHAR[s.portrait],N[s.actor]);e.name.textContent=N[s.actor];e.text.textContent=s.text;e.progress.textContent=id;e.dialogue.classList.remove('changing');e.text.classList.remove('changing');Array.isArray(s.choices)?choices(s.choices):hide(s);timer=setTimeout(()=>locked=false,fade?520:220)},fade?300:115)}function choices(items){e.choices.hidden=false;e.hint.style.visibility='hidden';e.list.replaceChildren();items.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=label;b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();if(locked)return;e.list.querySelectorAll('button').forEach(x=>x.disabled=true);show(next)});e.list.appendChild(b)})}function hide(s){e.choices.hidden=true;e.list.replaceChildren();e.hint.style.visibility='visible';e.hint.textContent=s.final?'праздник продолжается':'нажмите, чтобы продолжить'}document.getElementById('start').addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();e.splash.classList.add('leaving');setTimeout(()=>{e.splash.classList.remove('active','leaving');e.game.classList.add('active');show('start')},850)},{passive:false});document.getElementById('game').addEventListener('click',ev=>{if(ev.target.closest('button'))return;const s=S[current];if(!locked&&!s.choices&&s.next)show(s.next)});document.getElementById('restart').addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();clearTimeout(timer);locked=false;current='start';show('start')});
</script>
</body>
